name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2

      - name: Install zsh
        run: sudo apt-get update && sudo apt-get install -y zsh

      - name: Format
        run: cargo fmt --check

      - name: Lint
        run: cargo clippy --all-targets -- -D warnings

      - name: Unit tests
        run: cargo test

      - name: Build
        run: cargo build

      - name: End-to-end test of the TUI
        run: python3 tests/pty/tui.py target/debug/meow

      - name: End-to-end test of the zsh plugin
        run: python3 tests/pty/zsh_plugin.py shell/meow.zsh
